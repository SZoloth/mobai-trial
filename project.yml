name: TrialApp
options:
  bundleIdPrefix: dev.example.mobaitrial
  deploymentTarget:
    iOS: "18.0"
targets:
  TrialApp:
    type: application
    platform: iOS
    sources: [TrialApp]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGNING_ALLOWED: NO
